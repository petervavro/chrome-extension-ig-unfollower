<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IG Unfollower</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <img
          src="../images/icon-48.png"
          alt="IG Unfollower icon"
          class="icon"
        />
        <h1>IG Unfollower</h1>
      </header>

      <div id="status-card" class="status-card idle">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text"
          >Navigate to your Instagram profile to begin.</span
        >
      </div>

      <button id="toggle-btn" class="btn" disabled>Start Unfollowing</button>

      <p class="hint">Keep this tab visible while the automation runs.</p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
